get:
  operationId: campus_list
  summary: キャンパス一覧取得API
  description: キャンパスの一覧を取得するためのAPIです。
  parameters:
    - name: university_id
      in: query
      description: キャンパスを取得したい大学のidを指定
      required: false
      schema:
        type: string
        format: uuid
  tags:
    - campus
  security:
    - tokenAuth: []
    - jwtAuth: []
  responses:
    "200":
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../schemas/campus.yml"
      description: 成功（何もない場合は空の配列[]を返す）
    500:
      content:
        application/html:
          examples:
            クエリパラメタが不正:
              description: クエリパラメタuniversity_idが有効なUUIDではない場合、Djangoの黄色画面のhtmlが返される
