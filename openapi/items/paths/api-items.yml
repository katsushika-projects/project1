get:
  operationId: items_list
  summary: 商品一覧取得API
  description: 商品の一覧を更新日時が新しい順に20件ずつ取得するAPIです。ブロック中/被ブロック中のユーザーとキャンセル済み(canceled)の商品は除外されます。
  parameters:
    - in: query
      name: name
      description: |-
        商品名 <br>
        nameの値を含む商品名を持つ商品のみを返します。
      schema:
        type: string
      example: "線形代数"
    - in: query
      name: purchased
      description: |-
        購入されてない商品だけを返す <br>
        ?purchased=false とすると、購入されていない商品のみを返します。
      schema:
        type: string
      example: "false"
    - name: page
      description: |-
        ページ番号 <br>
        ページ番号を指定することで、指定したページの商品一覧を取得することができます。
      required: false
      in: query
      schema:
        type: integer
      example: 2
  tags:
    - item
  security:
    - tokenAuth: []
    - jwtAuth: []
  responses:
    "200":
      content:
        application/json:
          schema:
            $ref: "../schemas/paginated-item.yml"
      description: ""
