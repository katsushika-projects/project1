get:
  operationId: items_like_list
  summary: いいね商品一覧取得API
  description: |-
    ユーザーがいいねした商品のうち、未購入と購入済みの商品一覧を取得できるAPIです。<br>
    ブロック中/被ブロック中のユーザーの商品は取得できません。
  parameters:
    - in: query
      name: page
      description: |-
        ページ番号 <br>
        ページ番号を指定することで、指定したページの商品一覧を取得することができます。
      required: false
      schema:
        type: integer
  tags:
    - item
  security:
    - tokenAuth: []
    - jwtAuth: []
  responses:
    "200":
      content:
        application/json:
          schema:
            $ref: "../schemas/paginated-item.yml"
      description: ""
