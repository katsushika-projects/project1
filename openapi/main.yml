          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: ブロック解除成功
        400:
          description: ブロック解除失敗
          content:
            application/json:
              examples:
                存在しないユーザー:
                  value:
                    detail: ユーザーが存在しません
                ブロックしていないユーザー:
                  value:
                    detail: ブロックしていません
        401:
          description: 未認証
