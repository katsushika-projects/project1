openapi: 3.0.3
info:
  title: 教科書・参考書取引所 OpenAPI
  version: 2.0.0
  description: 教科書・参考書取引所 OpenAPI Schema
servers:
  - url: http://localhost:8000/api/v2
    description: 開発用サーバー
  - url: https://api.uni-bo.net/api/v2
    description: 本番用サーバー
paths:
  /auth/jwt/create/:
    post:
      summary: ログイン(jwt取得)
      operationId: auth_jwt_create_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.<br>
        期限は、アクセストークンが3時間、レフレッシュトークンが7日間です。
      tags:
        - jwt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenObtainPair"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenObtainPair"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TokenObtainPair"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenObtainPair"
          description: ""
        401:
          content:
            application/json:
              examples:
                存在しないemail or パスワードが正しくない:
                  value:
                    detail: No active account found with the given credentials
  /auth/jwt/refresh/:
    post:
      summary: リフレッシュ(アクセストークン再発行)
      operationId: auth_jwt_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.<br>
        期限は、アクセストークンが3時間、レフレッシュトークンが7日間です。
      tags:
        - jwt
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefresh"
          description: ""
        400:
          content:
            application/json:
              example:
                detail: No refresh
  /auth/logout/:
    post:
      summary: ログアウト
      operationId: auth_logout_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
        - jwt
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenBlacklist"
          description: "ログアウト成功"
        400:
          description: リフレッシュトークンが不足
          content:
            application/json:
              example:
                detail: No refresh
  /auth/users/:
    #   get:
    #     operationId: auth_users_list
    #     parameters:
    #     - name: page
    #       required: false
    #       in: query
    #       description: A page number within the paginated result set.
