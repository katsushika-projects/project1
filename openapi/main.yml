components:
  schemas:
    Activation:
      type: object
      properties:
        uid:
          type: string
          description: メール送信時に返却されるuid
        token:
          type: string
          description: メール送信時に返却されるtoken
      required:
        - token
        - uid
    ConditionEnum:
      enum:
        - new
        - fine
        - used
        - damaged
      type: string
      description: |-
        * `new` - 未使用
        * `fine` - 目立った傷や汚れなし
        * `used` - 使用感あり
        * `damaged` - 破損あり
    Image:
      type: object
      properties:
        order:
          type: integer
        photo_path:
          type: string
          format: uri
      required:
        - photo_path
    Item:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        seller:
          type: string
          readOnly: true
        receivable_campus:
          type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        is_liked_by_current_user:
          type: string
          readOnly: true
        listing_status:
          $ref: "#/components/schemas/ListingStatusEnum"
        price:
          type: integer
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 255
        condition:
          $ref: "#/components/schemas/ConditionEnum"
        writing_state:
          $ref: "#/components/schemas/WritingStateEnum"
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        buyer:
          type: string
          format: uuid
          title: ユーザーID
          nullable: true
      required:
        - condition
        - created_at
        - description
        - id
        - images
        - is_liked_by_current_user
        - name
        - price
        - receivable_campus
        - seller
        - updated_at
        - writing_state
    ListingStatusEnum:
      enum:
        - unpurchased
        - purchased
        - completed
        - canceled
      type: string
      description: |-
        * `unpurchased` - 未購入
        * `purchased` - 購入済み
        * `completed` - 取引完了
        * `canceled` - キャンセル済み
    PaginatedItemList:
      type: object
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: "#/components/schemas/Item"
    PaginatedUserList:
      type: object
      properties:
        count:
          type: integer
