get:
  operationId: messages_retrieve
  summary: メッセージ一覧取得API
  description: メッセージ一覧取得API
  parameters:
    - name: item_id
      in: query
      description: |
        メッセージを取得したい商品のidを指定できる。
        クエリパラメータとしてitem_idを指定するとその商品のメッセージを一覧として取得できる。
      required: false
      schema:
        type: string
        format: uuid
  tags:
    - messages
  responses:
    "200":
      description: "成功"
      content:
        application/json:
          schema:
            $ref: "../schemas/message.yml"
