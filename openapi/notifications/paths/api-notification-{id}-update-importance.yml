patch:
  operationId: notification_update_importance_update
  summary: 通知の重要度更新API
  description: |-
    通知の重要度を更新します。 <br>
    ログインしているアカウントの通知の重要度のみ更新できます。
  parameters:
    - in: path
      name: id
      description: |-
        URLには通知のIDが指定されている必要があります。
      schema:
        type: string
        format: uuid
      required: true
  tags:
    - notification
  requestBody:
    description: |-
      何も指定しないと何も変更されない。<br>
      確認されてる許容値<br>
      true: true, True, 1<br>
      false: false, False, 0
    content:
      application/json:
        schema:
          $ref: "../schemas/important.yml"
    required: true
  security:
    - AccessTokenAuth: []
  responses:
    "200":
      content:
        application/json:
          schema:
            $ref: "../schemas/important.yml"
      description: ""
    400:
      content:
        application/json:
          examples:
            値が不正:
              value:
                is_important:
                  - Must be a valid boolean.
    401:
      content:
        application/json:
          examples:
            ログインユーザーと通知のユーザーが異なる:
              description: No response body（）
    404:
      content:
        application/json:
          examples:
            パスパラメタが不正1:
              value:
                detail: 見つかりませんでした。
        application/html:
          examples:
            パスパラメタが不正2:
              description: パスパラメタidが有効なUUIDではない場合、Djangoの黄色画面のhtmlが返される
