get:
  operationId: comment_retrieve
  summary: コメント一覧取得API
  description: コメントの一覧を取得するためのAPIです。ログインユーザーがブロック中/被ブロック中のユーザーのコメントは除外されます。
  parameters:
    - name: item_id
      in: query
      description: |
        コメントを取得したい商品のidを指定できる。
        クエリパラメータとしてitem_idを指定するとその商品のコメントを一覧として取得できる。
      required: false
      schema:
        type: string
        format: uuid
  tags:
    - comment
  security:
    - tokenAuth: []
    - jwtAuth: []
  responses:
    "200":
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../schemas/comment.yml"
      description: "コメント一覧取得成功"
