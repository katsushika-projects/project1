post:
  operationId: comment_create_create
  summary: コメント作成API
  description: コメント作成API
  tags:
    - comment
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/create-comment.yml"
    required: true
  security:
    - AccessTokenAuth: []
  responses:
    "201":
      content:
        application/json:
          schema:
            $ref: "../schemas/comment.yml"
      description: ""
    400:
      description: 失敗（優先順位 Examplesの順）
      content:
        application/json:
          examples:
            keyが不足:
              value:
                item_id:
                  - この項目は必須です。
                message:
                  - この項目は必須です。
            値が不足:
              value:
                item_id:
                  - この項目はnullにできません。
                message:
                  - この項目は空にできません。
            値が不正1:
              value:
                item_id:
                  - “85335b31-8e58-4b2” は有効なUUIDではありません。
            値が不正2:
              value:
                item_id:
                  - '主キー "85335b31-8e58-4b2a-bd96-6e02ac43f560" は不正です - データが存在しません。'
            未購入でない商品:
              value:
                item_id:
                  - 未購入の商品にのみコメントできます
            ブロック中/被ブロック中のユーザーの商品:
              value:
                item_id:
                  - ブロック中/被ブロック中のユーザーの商品にはコメントできません
    500:
      content:
        application/html:
          examples:
            値が不正3:
              description: descriptionが100文字を超えた場合（上記のエラーコード400の方が優先）Djangoの黄色画面のhtmlが返される
